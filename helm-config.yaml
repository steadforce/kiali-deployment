# Configuration file used by the pipeline hydration step
# to render the manifests for the different environments
releaseName: &name kiali
namespace: *name
environments:
  local:
    apis: &apis
    - autoscaling.k8s.io/v1
    - cert-manager.io/v1
    - forecastle.stakater.com/v1alpha1
    - keycloak.org/v1alpha1
    - kiali.io/v1alpha1
    - kyverno.io/v1
    - monitoring.coreos.com/v1
    - networking.istio.io/v1beta1
    - ossmconsoles.kiali.io/v1alpha1 # is installed when route.openshift.io/v1 is supported by the cluster
    - security.istio.io/v1beta1
    valueFiles:
    - values-subchart-overrides.yaml
    - values-local.yaml
  sf-k8s01-dev:
    apis: *apis
    valueFiles: &devValues
    - values-subchart-overrides.yaml
    - values-development.yaml
  sf-k8s02-dev:
    apis: *apis
    valueFiles: *devValues
  sf-k8s01-prod:
    apis: *apis
    valueFiles:
    - values-subchart-overrides.yaml
    - values-production.yaml
