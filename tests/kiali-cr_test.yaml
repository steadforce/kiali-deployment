suite: Kiali CR authentication and ACME domain configuration
templates:
- kiali.yaml
capabilities:
  apiVersions:
  - kiali.io/v1alpha1
tests:
- it: disables TLS verification and uses the local ACME domain
  values:
  - ../values-local.yaml
  asserts:
  - equal:
      path: spec.auth.openid.insecure_skip_verify_tls
      value: true
  - equal:
      path: &issuerUriPath spec.auth.openid.issuer_uri
      value: "https://argocd.steadops.local.steadforce.com/api/dex"
  - equal:
      path: &grafanaUrlPath spec.external_services.grafana.url
      value: https://cluster-grafana.steadops.local.steadforce.com
  - matchSnapshot: {}

- it: enforces TLS verification and uses the development ACME domain
  values:
  - ../values-development.yaml
  asserts:
  - equal: &tlsVerificationEnabledAssert
      path: spec.auth.openid.insecure_skip_verify_tls
      value: false
  - equal:
      path: *issuerUriPath
      value: "https://argocd.dev.k8s01.steadforce.com/api/dex"
  - equal:
      path: *grafanaUrlPath
      value: https://cluster-grafana.dev.k8s01.steadforce.com
  - matchSnapshot: {}

- it: enforces TLS verification and uses the production ACME domain
  values:
  - ../values-production.yaml
  asserts:
  - equal: *tlsVerificationEnabledAssert
  - equal:
      path: *issuerUriPath
      value: "https://argocd.k8s01.steadforce.com/api/dex"
  - equal:
      path: *grafanaUrlPath
      value: https://cluster-grafana.k8s01.steadforce.com
  - matchSnapshot: {}

- it: enforces TLS verification and uses the k8s03-dev ACME domain
  values:
  - ../values-sf-k8s03-dev.yaml
  asserts:
  - equal: *tlsVerificationEnabledAssert
  - equal:
      path: *issuerUriPath
      value: "https://argocd.k8s03-dev.steadforce.com/api/dex"
  - equal:
      path: *grafanaUrlPath
      value: https://cluster-grafana.k8s03-dev.steadforce.com
  - matchSnapshot: {}
---
suite: Kiali CR pod annotations and resources per environment
templates:
- kiali.yaml
capabilities:
  apiVersions:
  - kiali.io/v1alpha1
tests:
- it: omits pod annotations and zeroes cpu resources for the local cluster
  values:
  - ../values-local.yaml
  asserts:
  - notExists:
      path: spec.deployment.pod_annotations
  - matchRegex:
      path: spec.deployment.resources.limits.cpu
      pattern: "^0.*"
  - matchRegex:
      path: spec.deployment.resources.requests.cpu
      pattern: "^0.*"
  - matchRegex:
      path: spec.deployment.resources.requests.memory
      pattern: "^0.*"
  - matchSnapshot: {}

- it: sets sidecar pod annotations and non-zero resources for the development cluster
  values:
  - ../values-development.yaml
  asserts: &kialiCrNonLocalAsserts
  - equal:
      path: spec.deployment.pod_annotations
      value:
        sidecar.istio.io/proxyCPU: 10m
        sidecar.istio.io/proxyCPULimit: 1000m
        sidecar.istio.io/proxyMemory: 64Mi
        sidecar.istio.io/proxyMemoryLimit: 80Mi
  - matchRegex:
      path: spec.deployment.resources.limits.cpu
      pattern: "^[1-9].*"
  - matchRegex:
      path: spec.deployment.resources.requests.cpu
      pattern: "^[1-9].*"
  - matchRegex:
      path: spec.deployment.resources.requests.memory
      pattern: "^[1-9].*"
  - matchSnapshot: {}

- it: sets sidecar pod annotations and non-zero resources for the production cluster
  values:
  - ../values-production.yaml
  asserts: *kialiCrNonLocalAsserts
