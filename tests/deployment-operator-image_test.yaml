suite: kiali-operator deployment image per cluster
templates:
- charts/kiali-operator/templates/deployment.yaml
release:
  name: kiali-operator
tests:
- it: uses the operator image for the local cluster
  values:
  - &subchartOverrideValuesFile ../values-subchart-overrides.yaml
  - ../values-local.yaml
  asserts: &operatorImageAssert
  - matchRegex:
      path: spec.template.spec.containers[?(@.name == "operator")].image
      pattern: "^quay.io/kiali/kiali-operator:"
  - matchSnapshot: {}

- it: uses the operator image for the development cluster
  values:
  - *subchartOverrideValuesFile
  - ../values-development.yaml
  asserts: *operatorImageAssert

- it: uses the operator image for the production cluster
  values:
  - *subchartOverrideValuesFile
  - ../values-production.yaml
  asserts: *operatorImageAssert
