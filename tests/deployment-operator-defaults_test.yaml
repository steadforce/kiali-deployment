suite: kiali-operator deployment defaults
templates:
- charts/kiali-operator/templates/deployment.yaml
release:
  name: kiali-operator
tests:
- it: allows access to all namespaces by default
  asserts:
  - contains:
      path: spec.template.spec.containers[?(@.name == "operator")].env
      content:
        name: ALLOW_ALL_ACCESSIBLE_NAMESPACES
        value: "true"
  - matchSnapshot: {}
- it: disables ad hoc Kiali images by default
  asserts:
  - contains:
      path: spec.template.spec.containers[?(@.name == "operator")].env
      content:
        name: ALLOW_AD_HOC_KIALI_IMAGE
        value: "false"
  - matchSnapshot: {}
- it: uses the kiali-operator image by default
  asserts:
  - matchRegex:
      path: spec.template.spec.containers[?(@.name == "operator")].image
      pattern: "^quay.io/kiali/kiali-operator:"
  - matchSnapshot: {}
