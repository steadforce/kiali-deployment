suite: Kiali virtual service routes through the ingress gateway per environment
templates:
- virtual-service.yaml
capabilities:
  apiVersions:
  - networking.istio.io/v1beta1
values:
- ../values-subchart-overrides.yaml
tests:
- it: routes through the istio-ingress gateway to the local ACME host
  values:
  - ../values-local.yaml
  asserts:
  - contains:
      path: spec.gateways
      content: istio-ingress/kiali-acme-gateway
  - contains:
      path: &hostsPath spec.hosts
      content: kiali.steadops.local.steadforce.com
  - matchSnapshot: {}

- it: routes through the istio-ingress gateway to the development ACME host
  values:
  - ../values-development.yaml
  asserts:
  - contains:
      path: *hostsPath
      content: kiali.dev.k8s01.steadforce.com
  - matchSnapshot: {}

- it: routes through the istio-ingress gateway to the production ACME host
  values:
  - ../values-production.yaml
  asserts:
  - contains:
      path: *hostsPath
      content: kiali.k8s01.steadforce.com
  - matchSnapshot: {}

- it: routes through the istio-ingress gateway to the k8s03-dev ACME host
  values:
  - ../values-development.yaml
  - ../values-sf-k8s03-dev.yaml
  asserts:
  - contains:
      path: *hostsPath
      content: kiali.k8s03-dev.steadforce.com
  - matchSnapshot: {}

- it: routes through the istio-ingress gateway to the k8s04-dev ACME host
  values:
  - ../values-development.yaml
  - ../values-sf-k8s04-dev.yaml
  asserts:
  - contains:
      path: *hostsPath
      content: kiali.k8s04-dev.steadforce.com
  - matchSnapshot: {}

- it: uses the ingress gateway namespace passed by Argo CD
  values:
  - ../values-production.yaml
  set:
    global.istio.ingressGateway.namespace: istio-ingress-external
  asserts:
  - equal:
      path: spec.gateways
      value:
      - istio-ingress-external/kiali-acme-gateway

- it: routes to the kiali service named after the subdomain
  values:
  - ../values-production.yaml
  asserts:
  - equal:
      path: metadata.name
      value: kiali
  - equal:
      path: spec.http[*].route[?(@.destination.host == "kiali")].destination.port.number
      value: 20001
